enum Weekday {
    MONDAY
    TUESDAY
    WEDNESDAY
    THURSDAY
    FRIDAY
    SATURDAY
    SUNDAY
}

type DayHours {
    weekday: Weekday!
    closed: Boolean!
    opensAt: String
    closesAt: String
    breakStartsAt: String
    breakEndsAt: String
}

input DayHoursInput {
    weekday: Weekday!
    closed: Boolean!
    opensAt: String
    closesAt: String
    breakStartsAt: String
    breakEndsAt: String
}

input UpdateSalonHoursInput {
    hours: [DayHoursInput!]!
    cancellationNoticeHours: Int!
}

enum ServiceCategory {
    HAIR
    MAKE_UP
    MASSAGE
}

enum BusyLevel {
    LOW
    MEDIUM
    HIGH
}

type Service {
    id: ID!
    name: String!
    category: ServiceCategory!
    durationMinutes: Int! @rename(attribute: "duration_minutes")
    priceFeninga: Int! @rename(attribute: "price_feninga")
}

type Worker {
    id: ID!
    name: String!
}

input CreateSalonServiceInput {
    name: String!
    category: ServiceCategory!
    durationMinutes: Int
    priceFeninga: Int!
}

input UpdateSalonServiceInput {
    name: String!
    category: ServiceCategory!
    durationMinutes: Int!
    priceFeninga: Int!
}

input CreateSalonWorkerInput {
    name: String!
}

input UpdateSalonWorkerInput {
    name: String!
}

enum BookingStatus {
    REQUESTED
    CONFIRMED
    TIME_PROPOSED
    DECLINED
    CANCELLED
}

type BookingService {
    name: String!
    durationMinutes: Int! @rename(attribute: "duration_minutes")
    priceFeninga: Int! @rename(attribute: "price_feninga")
}

type Booking {
    id: ID!
    status: BookingStatus! @method(name: "graphqlStatus")
    preferredDate: String! @method(name: "preferredDateString")
    preferredStartsAt: String! @method(name: "preferredStartsAtIso")
    durationMinutes: Int! @rename(attribute: "duration_minutes")
    customerName: String! @method(name: "customerName")
    worker: Worker
    proposedStartsAt: String @method(name: "proposedStartsAtIso")
    proposedWorker: Worker @method(name: "proposedWorkerOrNull")
    declineReason: String @rename(attribute: "decline_reason")
    salon: Salon!
    services: [BookingService!]! @method(name: "snapshotList")
    intake: AssistantIntake @field(resolver: "App\\GraphQL\\Queries\\BookingIntake")
    rescheduleDate: String @method(name: "rescheduleDateString")
    rescheduleStartsAt: String @method(name: "rescheduleStartsAtIso")
    reschedulePending: Boolean! @method(name: "reschedulePending")
    lateToCancel: Boolean! @method(name: "lateToCancel")
    cancelledAt: String @method(name: "cancelledAtIso")
    lateCancel: Boolean! @method(name: "lateCancel")
    noShowAt: String @field(resolver: "App\\GraphQL\\Queries\\BookingOwnerField@noShowAt")
}

input CreateBookingInput {
    salonId: ID!
    serviceIds: [ID!]!
    workerId: ID
    preferredDate: String!
    preferredTime: String!
    intakeToken: String
}

type AssistantIntake {
    id: ID!
    token: String!
    customerName: String! @method(name: "customerName")
    updatedAt: String! @method(name: "updatedAtIso")
    serviceIds: [ID!]! @method(name: "serviceIdList")
    workerId: ID @method(name: "workerIdString")
    workerConfirmed: Boolean! @rename(attribute: "worker_confirmed")
    preferredDate: String @rename(attribute: "preferred_date")
    preferredTime: String @rename(attribute: "preferred_time")
    takenOver: Boolean! @method(name: "takenOver")
    pinged: Boolean! @method(name: "pinged")
}

input UpsertAssistantIntakeInput {
    salonId: ID!
    token: String
    serviceIds: [ID!]!
    workerId: ID
    workerConfirmed: Boolean!
    preferredDate: String
    preferredTime: String
}

type User {
    id: ID!
    email: String!
    emailVerified: Boolean! @method(name: "hasVerifiedEmail")
    phone: String
    phoneVerified: Boolean! @method(name: "hasVerifiedPhone")
    salons: [Salon!]! @method(name: "salonList")
    favoriteSalonIds: [ID!]! @method(name: "favoriteSalonIdList")
}

type QrScan {
    id: ID!
    salonId: ID! @method(name: "salonIdString")
    customerId: ID! @method(name: "customerIdString")
    createdAt: String! @method(name: "createdAtIso")
}

type Salon {
    id: ID!
    name: String!
    address: String
    cancellationNoticeHours: Int! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@cancellationNoticeHours")
    dnd: Boolean! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@dnd")
    takeoverAllowed: Boolean! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@takeoverAllowed")
    noShowCount: Int! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@noShowCount")
    cancelCount: Int! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@cancelCount")
    lateCancelCount: Int! @field(resolver: "App\\GraphQL\\Queries\\SalonOwnerField@lateCancelCount")
    hours: [DayHours!]! @method(name: "dayHours")
    services: [Service!]! @method(name: "serviceList")
    workers: [Worker!]! @method(name: "workerList")
    busyLevel(date: String!): BusyLevel! @field(resolver: "App\\GraphQL\\Queries\\SalonBusyLevel")
}

type SalonStatsDay {
    date: String!
    weekday: Weekday!
    bookingsCount: Int!
    busyPercent: Int!
}

type SalonStatsHour {
    hour: Int!
    bookingsCount: Int!
}

type SalonStats {
    fromDate: String!
    toDate: String!
    bookingsCount: Int!
    cancellationRatePercent: Int!
    lateCancels: Int!
    days: [SalonStatsDay!]!
    hours: [SalonStatsHour!]!
}

type Query {
    vapidPublicKey: String!
    me: User
    salon(id: ID!): Salon
    salonsNearby(lat: Float!, lng: Float!, limit: Int = 20, offset: Int = 0, category: ServiceCategory, name: String): [Salon!]!
    popularInSarajevo(limit: Int = 20, offset: Int = 0, category: ServiceCategory, name: String): [Salon!]!
    pendingBookings(salonId: ID!, date: String!, limit: Int = 20, offset: Int = 0): [Booking!]!
    occupyingBookings(salonId: ID!, date: String!): [Booking!]!
    ownerBooking(id: ID!): Booking!
    myBookings(limit: Int = 20, offset: Int = 0): [Booking!]!
    assistantIntake(token: String!): AssistantIntake
    inFlightIntakes(salonId: ID!, limit: Int = 20, offset: Int = 0): [AssistantIntake!]!
    inFlightIntakeCount(salonId: ID!): Int!
    salonStats(salonId: ID!): SalonStats! @field(resolver: "App\\GraphQL\\Queries\\SalonStats")
    qrScans(salonId: ID!, limit: Int = 20, offset: Int = 0): [QrScan!]!
}

type Mutation {
    subscribePush(endpoint: String!, p256dh: String!, auth: String!): Boolean!
    login(email: String!, password: String!): User!
    register(email: String!, password: String!, phone: String): User!
    logout: Boolean!
    resendVerificationEmail: Boolean!
    requestPhoneOtp(phone: String!): Boolean!
    verifyPhoneOtp(code: String!): Boolean!
    updateSalonHours(salonId: ID!, input: UpdateSalonHoursInput!): Salon
    createSalonService(salonId: ID!, input: CreateSalonServiceInput!): Service
    updateSalonService(id: ID!, input: UpdateSalonServiceInput!): Service
    createSalonWorker(salonId: ID!, input: CreateSalonWorkerInput!): Worker
    updateSalonWorker(id: ID!, input: UpdateSalonWorkerInput!): Worker
    createBooking(input: CreateBookingInput!): Booking!
    upsertAssistantIntake(input: UpsertAssistantIntakeInput!): AssistantIntake!
    pingAssistantIntake(salonId: ID!, token: String): AssistantIntake!
    takeOverAssistantIntake(id: ID!): AssistantIntake!
    releaseAssistantIntake(id: ID!): AssistantIntake!
    updateSalonDnd(salonId: ID!, dnd: Boolean!): Salon
    acceptPreferredTime(bookingId: ID!): Booking!
    proposeTime(bookingId: ID!, workerId: ID!, proposedTime: String!): Booking!
    declineBooking(bookingId: ID!, reason: String): Booking!
    confirmProposedTime(bookingId: ID!): Booking!
    rejectProposedTime(bookingId: ID!): Booking!
    askOtherTime(bookingId: ID!, preferredDate: String!, preferredTime: String!): Booking!
    requestReschedule(bookingId: ID!, preferredDate: String!, preferredTime: String!): Booking!
    acceptReschedule(bookingId: ID!): Booking!
    dismissReschedule(bookingId: ID!): Booking!
    cancelBooking(bookingId: ID!): Booking!
    markNoShow(bookingId: ID!): Booking!
}

type Subscription {
    bookingCustomerResponded(salonId: ID!): Booking
    bookingRescheduled(salonId: ID!): Booking
    bookingCancelled(salonId: ID!): Booking
}
