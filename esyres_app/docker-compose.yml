# Slim local stack (php + vite + mysql + reverb). Remaining services
# (nginx, redis, worker, mailpit) come later —
# docs/architecture/07-Docker-and-Local-Dev.md
services:
  php:
    build:
      context: ./docker/php
    volumes:
      - .:/app
    working_dir: /app
    command: php artisan serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: esyres
      DB_USERNAME: esyres
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173,localhost:8000,127.0.0.1,127.0.0.1:5173,127.0.0.1:8000
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: esyres
      REVERB_APP_KEY: esyres
      REVERB_APP_SECRET: esyres-secret
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      LIGHTHOUSE_BROADCASTER: reverb
      LIGHTHOUSE_QUEUE_BROADCASTS: "false"
      LIGHTHOUSE_SUBSCRIPTION_STORAGE: database
    depends_on:
      mysql:
        condition: service_healthy

  reverb:
    build:
      context: ./docker/php
    volumes:
      - .:/app
    working_dir: /app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: esyres
      DB_USERNAME: esyres
      DB_PASSWORD: secret
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_APP_ID: esyres
      REVERB_APP_KEY: esyres
      REVERB_APP_SECRET: esyres-secret
      REVERB_HOST: localhost
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:22-bookworm
    volumes:
      - .:/app
    working_dir: /app/frontend
    command:
      - sh
      - -c
      - "test -d node_modules || npm install; exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://php:8000
      REVERB_PROXY: http://reverb:8080
      VITE_REVERB_APP_KEY: esyres
    depends_on:
      php:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: esyres
      MYSQL_USER: esyres
      MYSQL_PASSWORD: secret
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
