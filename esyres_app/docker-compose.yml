# Slim local stack (php + vite + mysql). Remaining services
# (nginx, redis, worker, reverb, mailpit) come later —
# docs/architecture/07-Docker-and-Local-Dev.md
services:
  php:
    build:
      context: ./docker/php
    volumes:
      - .:/app
    working_dir: /app
    command: php artisan serve --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: esyres
      DB_USERNAME: esyres
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173,localhost:8000,127.0.0.1,127.0.0.1:5173,127.0.0.1:8000
    depends_on:
      mysql:
        condition: service_healthy

  vite:
    image: node:22-bookworm
    volumes:
      - .:/app
    working_dir: /app/frontend
    command:
      - sh
      - -c
      - "test -d node_modules || npm install; exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://php:8000
    depends_on:
      php:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: esyres
      MYSQL_USER: esyres
      MYSQL_PASSWORD: secret
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
